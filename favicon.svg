<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="mirrorCAT">
  <title>mirrorCAT</title>
  <defs>
    <radialGradient id="tile" cx="32" cy="29" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#115e59"/>
      <stop offset="1" stop-color="#0b1220"/>
    </radialGradient>
    <linearGradient id="glass" x1="21" y1="16" x2="43" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e6feff"/>
      <stop offset=".5" stop-color="#67e8f9"/>
