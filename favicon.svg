  <ellipse cx="27" cy="21.6" rx="5.4" ry="2.9" transform="rotate(-35 27 21.6)" fill="#fff" opacity=".7"/>
  <circle cx="23.2" cy="20.4" r="1.7" fill="#fff" opacity=".9"/>
